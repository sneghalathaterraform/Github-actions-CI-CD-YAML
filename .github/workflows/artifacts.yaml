name: test-artifact

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a test file
        run: echo "Hello from build $(date)" > output.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-test-artifact
          path: output.txt
