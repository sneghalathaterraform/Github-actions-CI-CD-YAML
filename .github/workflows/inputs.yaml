name: Input Variables

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev

      version:
        description: 'App version to deploy (e.g. v1.2.0)'
        required: true
        type: string

      skip_tests:
        description: 'Skip running tests?'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: just show what we received
      - name: Show inputs
        run: |
          echo "Environment : ${{ inputs.environment }}"
          echo "Version     : ${{ inputs.version }}"
          echo "Skip tests? : ${{ inputs.skip_tests }}"

      # Step 2: this step ONLY runs if skip_tests is false
      - name: Run tests
        if: ${{ inputs.skip_tests == false }}
        run: echo "Running test suite for version ${{ inputs.version }}..."

      # Step 3: this step ONLY runs if skip_tests is true
      - name: Skip tests warning
        if: ${{ inputs.skip_tests == true }}
        run: echo "⚠️  Tests were skipped for version ${{ inputs.version }}"

      # Step 4: different behavior depending on which environment was picked
      - name: Deploy
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "🚀 Deploying ${{ inputs.version }} to PRODUCTION"
          elif [ "${{ inputs.environment }}" = "staging" ]; then
            echo "🧪 Deploying ${{ inputs.version }} to staging"
          else
            echo "🛠️  Deploying ${{ inputs.version }} to dev"
          fi
