name: NodeJs Matrix

on:
  push:
    branches:
      - master
      - main
      - dev
      - release

permissions:
  security-events: write
  issues: write
  actions: read
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        run: npm install

      - name: Upload file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-data-${{ matrix.os }}-node${{ matrix.node-version }}
          path: ~/.npm

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: npm install
      - name: Test
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy
        run: echo "My code is deployed !!"
