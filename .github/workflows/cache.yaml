name: test-cache

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache test
        id: cache-test
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-demo

      - name: Show cache hit or miss
        run: echo "Cache hit? ${{ steps.cache-test.outputs.cache-hit }}"

      - name: Install packages (only if package.json exists)
        run: npm install || echo "no package.json, skipping"
